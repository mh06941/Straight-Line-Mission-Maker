services:
  straightline:
    build: .
    ports:
      - "8000:8000"
    environment:
      STRAIGHTLINE_DATA_DIR: /app/backend/data
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      GEOCODE_URL: ${GEOCODE_URL:-https://nominatim.openstreetmap.org/search}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-StraightLine/0.1 (local development)}
      MAX_MISSION_DISTANCE_M: ${MAX_MISSION_DISTANCE_M:-25000}
      MAX_QUERY_AREA_KM2: ${MAX_QUERY_AREA_KM2:-400}
      OSM_CACHE_TTL_SECONDS: ${OSM_CACHE_TTL_SECONDS:-86400}
    volumes:
      - straightline-data:/app/backend/data
    restart: unless-stopped
volumes:
  straightline-data:
